[workspace]
members = [
    "crates/core",
    "crates/launcher",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ShellWen <me@shellwen.com>"]

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
