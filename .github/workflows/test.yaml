on:
  push:
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'

name: Test

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check native entry ABI
        run: |
          cmake -S crates/core/native -B target/native-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build target/native-tests --config Release --target v8_killer_abi_test
      - name: Run native entry ABI test (Unix)
        if: runner.os != 'Windows'
        run: target/native-tests/v8_killer_abi_test
      - name: Run native entry ABI test (Windows)
        if: runner.os == 'Windows'
        run: target/native-tests/Release/v8_killer_abi_test.exe
      - name: Run non-macOS tests
        if: matrix.os != 'macos-latest'
        run: cargo test --locked --verbose

      - name: Run macOS tests
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo test --locked --verbose --target aarch64-apple-darwin
          cargo test --locked --verbose --target x86_64-apple-darwin
