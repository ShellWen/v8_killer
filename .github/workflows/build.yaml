name: CI

on:
  pull_request:
    paths:
      - 'Cargo.*'
      - 'crates/**'
      - 'scripts/**'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - '.github/workflows/**'
      - '!.github/workflows/documentations.yaml'
  push:
    branches: [master]
    paths:
      - 'Cargo.*'
      - 'crates/**'
      - 'scripts/**'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - '.github/workflows/**'
      - '!.github/workflows/documentations.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      PROFILES: ${{ github.event_name == 'pull_request' && 'debug' || 'debug release' }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: Install native tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake g++ pkg-config
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Native cache identity
        id: native
        env:
          TARGET: ${{ matrix.target }}
        run: |
          {
            cmake --version
            if [[ $TARGET == x86_64-pc-windows-msvc ]]; then
              command -v cl
              cl 2>&1 || true
              printf '%s\n' "$VCToolsVersion" "$WindowsSDKVersion" "$VCToolsInstallDir" "$WindowsSdkDir"
            else
              gcc --version
              g++ --version
              dpkg-query -W | grep -E '^(cmake|gcc|g\+\+|binutils|libc6)'
            fi
          } | tee native-tools.txt
          echo "key=$(sha256sum native-tools.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          python -c 'import os; from pathlib import Path; p = Path(".cache/dobby/source.tar.gz").resolve(); open(os.environ["GITHUB_ENV"], "a", encoding="utf-8").write(f"V8_KILLER_DOBBY_ARCHIVE={p.as_posix()}\n")'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          cache-bin: false
          key: ${{ matrix.os }}-${{ matrix.target }}-${{ env.PROFILES }}-${{ steps.native.outputs.key }}-${{ hashFiles('Cargo.toml', 'crates/core/native/**', 'crates/core/build.rs', '.github/workflows/build.yaml') }}
          cache-directories: .cache/native-tests
      - uses: actions/cache@v4
        with:
          path: .cache/dobby
          enableCrossOsArchive: true
          key: dobby-archive-b6e5054dd75c54dfe5a7b9585722af344984de8fbf0e8456b45260cbb0b8b73f
      - name: Verify Dobby archive
        run: |
          mkdir -p .cache/dobby
          if [[ ! -f $V8_KILLER_DOBBY_ARCHIVE ]]; then
            curl --fail --location --retry 3 https://codeload.github.com/jmpews/Dobby/tar.gz/223aabced0431525c7d45196f9409fc505d58ac8 -o "$V8_KILLER_DOBBY_ARCHIVE"
          fi
          echo "b6e5054dd75c54dfe5a7b9585722af344984de8fbf0e8456b45260cbb0b8b73f  $V8_KILLER_DOBBY_ARCHIVE" | sha256sum --check --strict
      - uses: actions/cache@v4
        with:
          path: .cache/node
          key: node-official-${{ matrix.target }}-22.23.2-24.21.0-26.8.1-${{ hashFiles('scripts/ci-node.sh') }}
      - name: Rustfmt
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo fmt --all -- --check
      - name: Check CI scripts
        run: python scripts/test-ci.py
      - name: Native ABI regression
        env:
          TARGET: ${{ matrix.target }}
        run: |
          options=()
          executable=v8_killer_abi_test
          if [[ $TARGET == x86_64-pc-windows-msvc ]]; then
            options=(-G 'Visual Studio 17 2022' -A x64)
            executable=Release/v8_killer_abi_test.exe
          fi
          cmake -S crates/core/native -B ".cache/native-tests/$TARGET" -DCMAKE_BUILD_TYPE=Release "${options[@]}"
          cmake --build ".cache/native-tests/$TARGET" --config Release --parallel 2 --target v8_killer_abi_test
          ".cache/native-tests/$TARGET/$executable"
      - name: Build, test and lint
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/ci-build.sh "$TARGET" "$PROFILES"
      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-reports-${{ matrix.target }}
          path: reports/*.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload manual release build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/v8_killer_launcher
            target/${{ matrix.target }}/release/v8_killer_launcher.exe
            target/${{ matrix.target }}/release/libv8_killer_core.so
            target/${{ matrix.target }}/release/v8_killer_core.dll
          retention-days: 7
